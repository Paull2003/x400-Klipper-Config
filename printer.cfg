[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

# See the sample-lcd.cfg file for definitions of common LCD displays.

# A [probe] section can be defined instead with a pin: setting identical
# to the sensor_pin: for a bltouch
[bltouch]
sensor_pin: ^PB7
control_pin: PB6
#z_offset = 1.061
x_offset: 47
y_offset: -1
samples: 3
samples_result: median 

#[neopixel my_neopixel]
#pin: PB10


[bed_mesh]
speed: 500
horizontal_move_z: 5
mesh_min:50, 10
mesh_max: 370, 370
probe_count: 5, 5
mesh_pps: 3, 3
algorithm: bicubic

[exclude_object]

[include KAMP_Settings.cfg]

[gcode_macro PRINT_START]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

  HEAT_SOAK BED={BED_TEMP} TIME={BED_TEMP} NOZZLE={EXTRUDER_TEMP}

  M117 Heating nozzle...
  M118 Heating nozzle...
  M109 S{EXTRUDER_TEMP}
  Nozzle_wipe
  BED_MESH_CALIBRATE
  LINE_PURGE
  M117 Starting Print!
  M118 Starting Print!

[gcode_macro HEAT_SOAK]
description: Heat bed and nozzle, then heat soak before printing
gcode:
  {% set BED_TEMP = params.BED|default(60)|float %}
  {% set PRINT_NOZZLE_TEMP = params.NOZZLE|default(200)|float %}

  # Heat-soak time = bed temperature × 6 seconds
  {% set SOAK_TIME = BED_TEMP * 6 %}

  # Heat-soak nozzle temperature = 75% of print temperature
  {% set SOAK_NOZZLE_TEMP = PRINT_NOZZLE_TEMP * 0.75 %}

  M117 Heating bed...
  M118 Heating bed...
  M140 S{BED_TEMP}

  M117 Heating nozzle to {SOAK_NOZZLE_TEMP|int}C...
  M118 Heating nozzle to {SOAK_NOZZLE_TEMP|int}C...
  M104 S{SOAK_NOZZLE_TEMP}

  # Wait for bed and nozzle to reach soak temperatures
  M190 S{BED_TEMP}
  M109 S{SOAK_NOZZLE_TEMP}

  M117 Heat soaking...
  M118 Heat soaking...
  G4 P{SOAK_TIME * 1000}

  M117 Heat soak complete
  M118 Heat soak complete

[gcode_macro Print_END]
gcode:
  G91 ;Relative positionning
  ;G1 E-10 F3000 ;Retract a bit
  G1 Z0.8 G1 E-10 F3000
  G1 X5 Y5 F3000 ;Wipe out
  G1 Z10 ;Raise Z more
  G90 ;Absolute positionning
  G1 X350 Y350
  M106 S0 ;Turn-off fan
  M104 S0 ;Turn-off hotend
  M140 S0 ;Turn-off bed
  M84 X Y E Z;Disable all steppers but Z



