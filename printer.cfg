# This file contains common pin mappings for the BigTreeTech Octopus
# Pro v1.1 board.

# Important! Do not use this config with an Octopus Pro v1.0 board nor
# non-Pro board.

# To use this config, during "make menuconfig", select "Enable
# low-level configuration options", select the STM32H723
# micro-controller, select a "128KiB bootloader", and select a "25Mhz
# crystal".

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
[include fw_retract.cfg]
[include TEST_SPEED.cfg]
[include Nozzle_wipe.cfg]
#[include sample-bigtreetech-adxl345-v2.0.cfg]
# Driver0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 48
endstop_pin: PG6
position_endstop:383
position_max: 383
homing_speed: 50

# Driver1
[stepper_z]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 1.3333333
endstop_pin: PG9
position_endstop: 0.3
position_max: 300
homing_speed: 50
position_min: -10

# Driver2
[stepper_y]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 48
endstop_pin: PG10
position_endstop: 400
position_max: 400
homing_speed: 50
# Driver3
# The Octopus only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accesory such as an MMU

[stepper_y1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
rotation_distance: 48
microsteps: 16

# Driver4
[extruder]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 8.060453
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PA0 # HE0
sensor_pin:  PF4 # T0
sensor_type: ATC Semitec 104NT-4-R025H42G
min_extrude_temp: 80
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 330
#control = pid
#pid_kp = 29.116
#pid_ki = 2.813
#pid_kd = 75.338
max_extrude_cross_section: 6
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1000.0

#[filament_switch_sensor material_0]
#switch_pin: PG12

